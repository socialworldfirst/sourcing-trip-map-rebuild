<html lang="en">

<title>Sourcing Trip maps</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1F2323;--mute:#484F56;--line:#ECEDEE;--bg:#FFFFFF;--rose:#FF0051;--panel:rgba(72,79,86,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#FFFFFF;--mute:#ECEDEE;--line:#32006E;--bg:#13002D;--panel:rgba(50,0,110,.35)}}
:root[data-theme="dark"]{--ink:#FFFFFF;--mute:#ECEDEE;--line:#32006E;--bg:#13002D;--panel:rgba(50,0,110,.35)}
*{box-sizing:border-box}body{font-family:Poppins,"Alibaba PuHuiTi",sans-serif;margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 Poppins,"Alibaba PuHuiTi",sans-serif}
main{max-width:1240px;margin:0 auto;padding:40px 16px 80px}
h1{font-size:28px;margin:0 0 6px;letter-spacing:-.02em}h2{font-size:18px;margin:40px 0 10px}
.sub{color:var(--mute);margin:0 0 24px}
.lang{position:fixed;top:14px;right:16px;display:flex;gap:6px}.lang button{font:500 12px Poppins;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.lang button.on{background:var(--ink);color:var(--bg)}
body.en .zh,body:not(.en) .en{display:none}
ol{padding-left:20px}li{margin:4px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:18px}
.clip video{width:100%;aspect-ratio:16/9;background:#13002D;border-radius:6px;display:block}
.meta{display:flex;flex-direction:column;gap:2px;margin-top:8px;font-size:13px;color:var(--mute)}.meta b{color:var(--ink);font-weight:600;font-size:14px}
.meta a{color:var(--rose);text-decoration:none;font-weight:500}
pre{white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;font:400 14px/1.7 Poppins,"Alibaba PuHuiTi",sans-serif}
table{border-collapse:collapse;width:100%;font-size:14px}td{border-top:1px solid var(--line);padding:8px 6px;vertical-align:top}td:first-child{width:150px;color:var(--mute)}
</style>
<style>
:root{--gate-ink:#111;--gate-mute:#8a8a8a;--gate-line:#e5e5e5;--gate-bg:#fff}
@media (prefers-color-scheme:dark){:root{--gate-ink:#f2f2f2;--gate-mute:#8a8a8a;--gate-line:#2a2a2a;--gate-bg:#0e0e0e}}
#gate{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;
justify-content:center;background:var(--gate-bg);
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
#gate-card{width:min(320px,86vw);text-align:left}
#gate-card h2{font-size:15px;font-weight:600;letter-spacing:-.01em;
color:var(--gate-ink);margin:0 0 4px}
#gate-card p{font-size:12px;color:var(--gate-mute);margin:0 0 20px;line-height:1.5}
#gate-form{display:flex;gap:8px}
#gate-input{flex:1;padding:9px 11px;font-size:13px;color:var(--gate-ink);
background:transparent;border:1px solid var(--gate-line);border-radius:6px;outline:none}
#gate-input:focus{border-color:var(--gate-ink)}
#gate-btn{padding:9px 15px;font-size:13px;border:1px solid var(--gate-ink);
border-radius:6px;background:var(--gate-ink);color:var(--gate-bg);cursor:pointer}
#gate-err{min-height:16px;margin-top:9px;font-size:12px;color:#c0392b}
#gate-foot{margin-top:22px;font-size:11px;color:var(--gate-mute)}
.gate-lock{position:fixed;right:12px;bottom:10px;z-index:9998;font:11px
-apple-system,BlinkMacSystemFont,sans-serif;color:#9a9a9a;cursor:pointer;
opacity:.55;text-decoration:underline}
.gate-lock:hover{opacity:1}
</style>
</head>

<script>
(function(){
  var KEY='gate:'+location.pathname;
  function b2b(b64){var s=atob(b64),a=new Uint8Array(s.length);
    for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
  async function derive(pw,salt,it){
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),
      'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:it,
      hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  }
  async function decrypt(pw){
    var b=JSON.parse(document.getElementById('gate-payload').textContent);
    var k=await derive(pw,b2b(b.salt),b.iterations);
    var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2b(b.iv)},k,
      b2b(b.ciphertext));
    return new TextDecoder().decode(plain);
  }
  function runScripts(root){
    root.querySelectorAll('script').forEach(function(old){
      var s=document.createElement('script');
      for(var i=0;i<old.attributes.length;i++){
        s.setAttribute(old.attributes[i].name,old.attributes[i].value);
      }
      s.textContent=old.textContent;
      old.parentNode.replaceChild(s,old);
    });
  }
  function reveal(html){
    var c=document.getElementById('gate-content');
    c.innerHTML=html; c.hidden=false;
    var g=document.getElementById('gate'); if(g) g.remove();
    document.body.classList.remove('gate-locked');
    runScripts(c);
    var lock=document.createElement('div');
    lock.className='gate-lock'; lock.textContent='lock device';
    lock.onclick=function(){localStorage.removeItem(KEY);location.reload();};
    document.body.appendChild(lock);
    window.dispatchEvent(new Event('gate:unlocked'));
    try{window.dispatchEvent(new Event('resize'));}catch(e){}
  }
  window.gateSubmit=async function(e){
    e.preventDefault();
    var inp=document.getElementById('gate-input');
    var err=document.getElementById('gate-err');
    err.textContent='';
    try{
      var html=await decrypt(inp.value);
      localStorage.setItem(KEY,inp.value);
      reveal(html);
    }catch(_){ err.textContent='Wrong password.'; inp.select(); }
    return false;
  };
  document.addEventListener('DOMContentLoaded',async function(){
    var saved=localStorage.getItem(KEY);
    if(!saved) return;
    try{ reveal(await decrypt(saved)); }
    catch(_){ localStorage.removeItem(KEY); }
  });
})();
</script>
